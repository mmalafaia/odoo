[options]
; =============================================================================
; Configuração do Odoo para Desenvolvimento - Ubuntu
; =============================================================================

; --- Conexão com o Banco de Dados ---
db_host = localhost
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo_dev
db_template = template0
db_maxconn = 64

; --- Diretórios de Addons ---
addons_path = ./addons, ./enterprise, ./user/outview_odoo_itsm

; --- Servidor HTTP ---
http_port = 8069
http_interface = 0.0.0.0
proxy_mode = False

; --- Longpolling (Gevent/Websocket) ---
gevent_port = 8072

; --- Trabalhadores e Performance ---
; Para desenvolvimento, usar 0 (modo single-threaded)
workers = 0
; Para produção, use: workers = (2 * CPU cores) + 1
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192

; --- Segurança ---
; Defina uma senha forte para o admin database
admin_passwd = admin
; Para produção, gere uma senha forte: openssl rand -hex 32

; --- Logging ---
log_level = info
; logfile = /home/vanguard/Documentos/GitHub/odoo/odoo.log
; Níveis: debug, info, warning, error, critical
; log_handler = :INFO
; logrotate = True

; --- Armazenamento de Dados ---
data_dir = /home/vanguard/.local/share/Odoo

; --- Modo de Desenvolvimento ---
; Descomente para desenvolvimento
; dev = reload,qweb,xml

; --- Idioma ---
; load_language = pt_BR

; --- Filtro de Banco de Dados ---
; Descomente para produção
; dbfilter = ^%d$
; list_db = False

; --- Email (SMTP) ---
; smtp_server = smtp.example.com
; smtp_port = 587
; smtp_user = user@example.com
; smtp_password = password
; smtp_ssl = False
; email_from = odoo@example.com
